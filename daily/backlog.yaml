      ease: '3: mjlab''s JointPositionActionCfg, BuiltinPositionActuatorCfg and UniformVelocityCommandCfg; the phase term goes through the playground''s _gait_clock, as unitreerl; mjlab 1.5.3 shims'
    - task: Walka-Rough, the same on mjlab's generated rough terrain with a raycast height scan
      policy: 'logs/rsl_rl/walka_velocity/2026-07-30_09-11-46/policy.onnx in git (obs 273 = 86 + 187-ray height_scan at scale 0.2, actions 24, metadata; env.yaml says generator and 2048 envs; trained at 9ca15d8 on a clean tree)'
