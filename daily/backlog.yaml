# The daily routine's queue (ROUTINE.md, part D), first entry first. Its scout (part A)
# adds entries, orders them by popularity plus ease and removes the ones that already have
# a task, through the `claude/daily-backlog` pull request. An entry is one repository, to be
# ported with every simulation in it that mjswan can run.
#
#   id           playground id
#   repo         upstream repository
#   commit       the commit the entry was reviewed at
#   simulations  each mjlab task or experiment with a trained policy of its own: `task`,
#                `policy` (where the checkpoint is) and `ease`
#   left_out     upstream's other simulations, each with why it is not ported
#   license      everything the build fetches: code, checkpoints, clips, robot assets
#   popularity   0 to 3, with the stars and posts it rests on (ROUTINE.md, part A)
#   ease         0 to 3: its simulations' lowest above 0; 0 is a stop for an unattended run
#   notes        what the port is known to need
#   found        for an entry the scout added: when, and the evidence
#   pinned       a person's reason to port it first (ROUTINE.md, parts A and D)
#   rejected     a person's reason never to port it; such an entry keeps only `id` and `repo`
#
# An entry with a single `task` and `policy` still waits for part A to list its
# repository's simulations.

- id: sonic
  repo: https://github.com/bethalageetachandraraju/sonic_4_-mjlab
  commit: c649dac4044277f91c9e3c5f8b41b3acc7a94ffb
  simulations:
    - task: SONIC's G1 motion tracking rebuilt as an mjlab ManagerBasedRlEnv (sonic_mjlab/envs/env_cfg.py, composed from SONIC's Hydra tree by sonic_mjlab/envs/factory.py; tested at mjlab 1.6.0), NVIDIA's released GEAR-SONIC policy tracking reference motion through its G1 encoder (its teleop and SMPL encoders also run)
      policy: 'Hugging Face nvidia/GEAR-SONIC at 6733128a3d8a523b1418b06bca3cdf61c8b0987f: sonic_release/last.pt with config.yaml (469 MB; loads with a strict state-dict match), or the release''s model_encoder.onnx (1,750 tokenizer features and an encoder index to a 64-dim token) and model_decoder.onnx (the token and 930 proprioceptive values, 10-frame histories, to 29 actions); clips from the same revision''s sample_data/robot_filtered (two walking clips)'
      ease: '1: a generic extension on top of several rewrites: the G1 encoder''s tokenizer reads future reference frames with joint velocities, which mjswan''s TrackingCommand look-ahead does not serve (as orcs); SonicMotionCommand needs a binding; the encoder and decoder chained into one graph; SONIC''s Isaac Lab joint and body order permuted (SonicRobotAdapter)'
  left_out: >-
    The release's low_latency and sonic_v1_1 checkpoints and planner_sonic.onnx: other
    versions of the same controller, which the port does not load. Rough terrain, HOI
    objects, cameras, height scans, the force-push curriculum and the H2 are not ported
    upstream.
  license: 'Apache-2.0 for the port (LICENSE) and GR00T-WholeBodyControl''s training stack; NVIDIA Open Model License for the weights (the Hub card); the sample clips are NVIDIA''s release, terms not checked; the G1 is Unitree''s (BSD-3-Clause)'
  popularity: '0: 0 stars (2026-10-19), created 2026-10-15; the weights it plays are NVIDIA''s (nvidia/GEAR-SONIC, 83 likes; NVlabs/GR00T-WholeBodyControl, 3.8k stars)'
  ease: '1: its one policy needs SONIC''s joint-velocity look-ahead on top of several rewrites'
  notes: >-
    A third party's port of NVIDIA's GEAR-SONIC (arXiv 2511.07820) from Isaac Lab to mjlab:
    SONIC's trainer, policy, losses and motion library run unchanged, and only the
    environment is rebuilt on mjlab. On the two sample clips it reports success 1.0 and a
    local MPJPE of 17.5 mm, SONIC's convergence bar. The decoder reads base_ang_vel,
    joint_pos, joint_vel, actions and gravity_dir, each with a 10-frame history in SONIC's
    joint order; actions go through mjlab's joint position action at SONIC's scale.
    GR00T-WholeBodyControl is an editable path dependency with no pinned commit, so the port
    pins one. The same SONIC base as orcs. One commit, created 2026-10-15.
  found: '2026-10-16: GitHub search for mjlab (created since 2026-10-14), 0 stars'
  pinned: '2026-10-19: the owner asked for orcs, parkour, sonic and walka next, in that order'

