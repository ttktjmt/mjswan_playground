  notes: >-
    A whole-body G1 tracker for teleoperation, BeyondMimic-style, with mjlab's own
    JointPositionActionCfg and G1 actuators (get_g1_robot_cfg, G1_ACTION_SCALE); 200 Hz
    physics, decimation 4. The env deletes the XML's actuators and keyframes and reads the
    XML from assets/robots/unitree_g1, which archives/robot_assets.tar.gz on the models repo
    fills. The actor_history group (history_length 10, flatten_history_dim False) feeds
    obs_history through a temporal CNN baked into the ONNX: in_keys actor and
    actor_history, and the 3-D feed is the mjswan extension (step 9). MotionCommand reads
    precomputed h5 shards with FK body arrays, while the Hub's are minimal (pico_record:
    joint_pos, root_pos and root_quat_w at 30 fps, 128 windows of 512 frames from 9 clips):
    replay one window through FK at 50 Hz into an mjlab npz for add_motion, and keep a
    precomputed shard for the trace env. The native TrackingCommand serves command,
    joint_pos and the anchor fields but not joint_vel, so ref_joint_vel reads the second
    half of command. Play samples from the clip start with no pose or velocity ranges. The
    commands module imports h5py, which the playground locks only through myosuite, and
    MotionCommand._update_command(self) needs dropping_env_ids for mjlab 1.6, as duet.
  found: '2026-10-09: mjlab Show and tell #892; 195 stars'

