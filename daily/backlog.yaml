  license: 'none stated (no LICENSE, none in the README): all rights reserved; the Walka MJCF was converted from a jackbot_v1.urdf export (docs/kinematic_structure_analysis.md), source unpublished'
  popularity: '0: 2 stars (2026-10-16)'
  ease: '3: both walks on mjlab''s own classes with the gait clock'
  notes: >-
    A small humanoid walking on flat and rough ground, migrated from an Isaac Lab
    project. Imports itself as top-level `src`, like unitreerl: checkout shape. Pins
    mjlab==1.5.3 and mujoco-warp 3.10.0.3. 200 Hz physics, decimation 4. Phase period
    0.6 s from episode_length_buf; use _gait_clock.clock_phase. Flat play narrows the
