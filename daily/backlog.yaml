- id: teleopit
  repo: https://github.com/BotRunner64/Teleopit
  commit: f9263865c581802ad531854b8e547e2403a945f3
  task: General-Tracking-G1 (register_mjlab_task in train_mimic/tasks/tracking/config/registry.py)
  policy: Hugging Face 12e21/Teleopit-models at 94cf996444fea6894b87c28e86606cd4c2f1408f (tag v0.5.0), checkpoints/track_g1.onnx (inputs obs [1, 167] and obs_history [1, 10, 167]; actions 29)
  license: Apache-2.0 for the code; MIT for the Hub models and the Hub datasets 12e21/Teleopit-datasets (their cards); the G1 XML from archives/robot_assets.tar.gz on the models repo (GMR's Unitree G1, BSD-3-Clause meshes); the sample BVH clips look like LAFAN1 (CC BY-NC-ND 4.0), so take the clip from the MIT datasets
  popularity: '1: 195 stars (2026-10-10); mjlab Show and tell #892'
  ease: '1: a generic extension (the second input is an unflattened 10-frame history, obs_history [1, 10, 167], which mjswan does not feed as 3-D yet) on top of several rewrites: a command binding for its own MotionCommand, a clip rebuilt from an h5 shard, and shims for mjlab==1.4.0'
  notes: >-
