# The daily routine's queue (ROUTINE.md, part D), first entry first. Its scout (part A)
# adds entries, orders them by popularity plus ease and removes the ones that already have
# a task, through the `claude/daily-backlog` pull request. An entry is one repository, to be
# ported with every simulation in it that mjswan can run.
#
#   id           playground id
#   repo         upstream repository
#   commit       the commit the entry was reviewed at
#   simulations  each mjlab task or experiment with a trained policy of its own: `task`,
#                `policy` (where the checkpoint is) and `ease`
#   left_out     upstream's other simulations, each with why it is not ported
#   license      everything the build fetches: code, checkpoints, clips, robot assets
#   popularity   0 to 3, with the stars and posts it rests on (ROUTINE.md, part A)
#   ease         0 to 3: its simulations' lowest above 0; 0 is a stop for an unattended run
#   notes        what the port is known to need
#   found        for an entry the scout added: when, and the evidence
#   pinned       a person's reason to port it first (ROUTINE.md, parts A and D)
#   rejected     a person's reason never to port it; such an entry keeps only `id` and `repo`
#
# An entry with a single `task` and `policy` still waits for part A to list its
# repository's simulations.

- id: walka
