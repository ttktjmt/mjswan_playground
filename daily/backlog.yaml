    1.6.0; MotionCommand._update_command(self) needs dropping_env_ids, and the G1 constants
    differ between 1.2.0 and 1.6.0 only in asset loading and collision defaults. Upstream
    registers each release config per process under one fixed id, so register one id per
    scene: a plane scene with the six plane policies, each with its own clip, and five box
    scenes. Actor 160: command 58, motion_anchor_pos_b, motion_anchor_ori_b, base_lin_vel
    and base_ang_vel (IMU sensors), joint_pos (biased) and joint_vel, actions; the
    curriculum drops corruption, pushes and every startup randomization. Anchor torso_link,
    14 tracked bodies; terminations anchor_pos (z, 0.35), anchor_ori (0.8) and ee_body_pos
    (z, 0.25, feet). 200 Hz physics, decimation 4. The checkpoints are rsl-rl 5.0.1
    (actor_state_dict, MLP 512-256-128 ELU) and convert with the task's runner. The release
    runner also refreshes the command's relative-body cache after a reset
    (install_initial_reference_refresh), which only ee_body_pos and the rewards read.
    MotionResidualJointPositionActionCfg (mdp/actions.py) is ReferenceJointPositionActionCfg
    under another name (target = q_ref(t) + scale * a - encoder bias, the reference read
    once per control step, offset and clip unused) and would need a rename to bind, but no
    released policy uses it. Both Hub revisions are the pair upstream's downloader pins
    (mimicx/configs/releases/demonstrations.json); main (defcdbf, 84803d3) serves the same
    manifest and file indexes. Anonymous-for-Sub/MimicX is the anonymous review copy, with
    the same overlay tree.
