[project]
name = "mjswan-playground"
version = "0.1.0"
description = "A collection of browser-ready tasks built on mjswan"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "mjswan Developers" }]
# Inherited from mjswan: labmaze (transitive, via myosuite -> dm-control) has no
# pre-built wheel for 3.13+.
requires-python = ">=3.10, <3.13"
dependencies = [
    "mjswan>=0.11.7",
    "mjlab==1.6.0",
    "torch>=2.9.1",
    "onnx>=1.20.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Registers the `Wbc-*` tasks with mjlab; only the wbc task needs it.
wbc = ["wbc-mjlab>=0.0.6"]
# Registers the `myoMimic*` tasks with mjlab and reads the public Orbax checkpoint; only
# the musclemimic task needs it.
musclemimic = [
    "myosuite[musclemimic]",
    "orbax-checkpoint>=0.11",
    "onnxconverter-common>=1.16",
]
spinkick = ["spinkick-example"]
# Registers myosuite's waypoint task and TERRA's helpers, and reads the TERRA-4B Orbax
# checkpoint; only the terra task needs it.
terra = ["myosuite[musclemimic]", "orbax-checkpoint>=0.11"]

[project.scripts]
mjswan-playground = "mjswan_playground._cli:app"
# Short alias for the same CLI.
msp = "mjswan_playground._cli:app"

[project.urls]
"GitHub" = "https://github.com/ttktjmt/mjswan_playground"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mjswan_playground"]

[tool.uv.sources]
# TERRA's code is only on feat/programmatic-waypoint-tasks; move to main once it merges.
myosuite = { git = "https://github.com/MyoHub/myosuite", rev = "992bd58928e61d3f7ce27a033be02d0be18a2c18" }
spinkick-example = { git = "https://github.com/mujocolab/g1_spinkick_example", rev = "f1c4b230bd1a76c44e801e49f079212b6c6487da" }

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff==0.16.0"]
# Only `scripts/record_preview.py` needs them; playwright pulls a browser down with it.
previews = ["pillow>=10", "playwright>=1.55"]

[tool.ruff]
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
