[project]
name = "mjswan-playground"
version = "0.1.0"
description = "A collection of browser-ready tasks built on mjswan"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "mjswan Developers" }]
# Inherited from mjswan: labmaze (transitive, via myosuite -> dm-control) has no
# pre-built wheel for 3.13+.
requires-python = ">=3.10, <3.13"
dependencies = [
    # ponytail: bump to >=0.9.2 (and relock) once the stable release ships. The beta is
    # what the `pacman` task needs — the traced-term fidelity fixes in
    # ttktjmt/mjswan#101: mjlab's observation history order, adapting a task's subclass of
    # an mjlab observation group (whose absence fails the build), and the entity-scoped
    # event write (whose absence throws the robot instead of the ball).
    "mjswan>=0.9.2b0",
    "mjlab==1.5.3",
    "torch>=2.9.1",
    "onnx>=1.20.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Registers the `Wbc-*` tasks with mjlab; only the wbc-g1 task needs it.
wbc = ["wbc-mjlab>=0.0.5"]

[project.scripts]
mjswan-playground = "mjswan_playground._cli:app"

[project.urls]
"GitHub" = "https://github.com/ttktjmt/mjswan_playground"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mjswan_playground"]

# Same overrides mjswan itself carries: mjlab pulls a mujoco older than the one
# mujoco-warp needs, and myosuite pins an h5py with no arm64 wheel.
[tool.uv]
override-dependencies = [
    "mujoco==3.10.0",
    "mujoco-mjx==3.10.0",
    "mujoco-warp>=3.10.0.3,<3.11",
    "h5py>=3.8.0",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff==0.16.0"]

[tool.ruff]
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
